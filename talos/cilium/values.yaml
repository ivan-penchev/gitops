ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: "192.168.68.29"
k8sServicePort: 6443
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
l2announcements:
  enabled: true
externalIPs:
  enabled: true
# certgen CronJob creates the Hubble CA and server certs in-cluster, so no key
# material lands in cilium.yaml.
hubble:
  tls:
    auto:
      method: cronJob
