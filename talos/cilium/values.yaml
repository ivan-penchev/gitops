ipam:
  mode: kubernetes
kubeProxyReplacement: true
# KubePrism, the API load balancer Talos runs on every node. The render then
# works for any cluster, and Cilium keeps reaching the API if the VIP moves.
k8sServiceHost: localhost
k8sServicePort: 7445
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
l2announcements:
  enabled: true
externalIPs:
  enabled: true
# certgen CronJob creates the Hubble CA and server certs in-cluster, so no key
# material lands in cilium.yaml.
hubble:
  tls:
    auto:
      method: cronJob
