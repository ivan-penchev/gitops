name: arc-smoke
on:
  push:
    paths: [.github/workflows/arc-smoke.yml]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: gha-homelab-arc
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Cluster reachable via in-cluster SA
        run: |
          echo "=== client/server version ==="; kubectl version
          echo "=== namespaces (API reachable + read works) ==="; kubectl get ns
      - name: RBAC assertions (can-i returns no => exit 1, so don't fail the job)
        run: |
          set +e
          s=$(kubectl auth can-i get secrets -A);            echo "get secrets -A            -> $s   (want: no)"
          k=$(kubectl auth can-i patch kustomizations.kustomize.toolkit.fluxcd.io -n flux-system); echo "patch kustomizations       -> $k   (want: yes)"
          d=$(kubectl auth can-i update deployments -A);     echo "update deployments -A      -> $d   (want: yes)"
          i=$(kubectl auth can-i impersonate serviceaccounts -A); echo "impersonate SAs -A        -> $i   (want: no)"
          [ "$s" = "no" ] && [ "$k" = "yes" ] && [ "$d" = "yes" ] && [ "$i" = "no" ] && { echo "RBAC SHAPE OK"; exit 0; } || { echo "RBAC SHAPE UNEXPECTED"; exit 1; }
