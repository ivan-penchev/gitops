# Self-hosted Renovate.
#
# Runs weekly (and on-demand) on GitHub-hosted compute — Renovate only reads
# this repo and queries upstream registries, so it needs no cluster access.
#
# It authors PRs with a DEDICATED fine-grained PAT (secrets.RENOVATE_TOKEN,
# scoped Contents:RW + Pull requests:RW on this repo) and NOT the default
# GITHUB_TOKEN. This is deliberate and load-bearing: PRs opened with
# GITHUB_TOKEN do not trigger other workflows, so the gitops-live-test gate
# would never fire. A PAT-authored PR triggers it normally.
#
# The Renovate behaviour itself (managers, schedule, one-dep-per-PR, no
# automerge) lives in /renovate.json.
name: renovate

on:
  schedule:
    # Monday 04:00 Europe/Copenhagen-ish (cron is UTC). renovate.json also
    # constrains PR creation to Monday 00:00-06:00, so this is the trigger.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options: ["debug", "info", "warn"]
      dryRun:
        description: "Dry run (no PRs/branches written)"
        required: false
        default: false
        type: boolean

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || null }}
          # ghcr.io/ivan-penchev/wattbill is a private package. Without
          # credentials Renovate's docker datasource gets a 401/403 listing
          # tags and can never see a new one to open a PR for. renovate.json
          # cannot hold this itself: hostRules there would need the token
          # committed in the clear, and Renovate's templating does not reach
          # into Actions secrets from a repo config file. So it is set here
          # instead, as a JSON-encoded RENOVATE_HOST_RULES env var built from
          # secrets.GHCR_READ_TOKEN (same read:packages PAT as ghcr-pull in
          # kubernetes/apps/wattbill), which only this workflow ever sees.
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"ghcr.io","hostType":"docker","username":"ivan-penchev","password":"${{ secrets.GHCR_READ_TOKEN }}"}]
