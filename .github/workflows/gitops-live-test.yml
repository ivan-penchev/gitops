# This changes live workloads. The root stays suspended during the PR test.
# Pause FluxInstance reconciliation too, or the operator can undo that suspension
# and restore its own source ref. Both pauses must be acknowledged before switching.
# The independent watchdog uses the same recovery commands as the runner.
name: gitops-live-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

# Serialize: only ONE live test may hold the cluster on a PR SHA at a time.
concurrency:
  group: gitops-live-test
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  live-test:
    # Other same-repository PRs require an explicit, manually applied label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'renovate/') || contains(github.event.pull_request.labels.*.name, 'gitops-live-test')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'gitops-live-test')
    runs-on: gha-homelab-arc
    timeout-minutes: 25
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Recovery starts after 20 minutes, even if the runner disappears.
      WATCHDOG_SECONDS: "1200"
      # Alpine-based: includes /bin/sh, core utilities and kubectl 1.36.
      WATCHDOG_IMAGE: "ghcr.io/fluxcd/flux-cli:v2.9.6"
    steps:
      - name: Authorize PR and reject changes the suspended root cannot test
        uses: actions/github-script@v9
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const eventPR = context.payload.pull_request;
            const optedIn = pr.head.ref.startsWith('renovate/') ||
              pr.labels.some(label => label.name === 'gitops-live-test');
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== eventPR.head.sha || pr.head.ref !== eventPR.head.ref || !optedIn) {
              core.setFailed('PR must still be open, target main, and match this same-repository head. Non-Renovate PRs must retain the gitops-live-test label.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            if (files.some(f => [f.filename, f.previous_filename].some(
              p => p?.startsWith('kubernetes/clusters/homelab/')))) {
              core.setFailed('Root and FluxInstance changes need a separate migration/controller test. The live test keeps the root and FluxInstance suspended.');
            }

      - name: Install flux + kubectl
        run: |
          set -euo pipefail
          curl -s https://fluxcd.io/install.sh | sudo bash
          if ! command -v kubectl >/dev/null 2>&1; then
            KVER="$(curl -sL https://dl.k8s.io/release/stable.txt)"
            curl -sLO "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
            sudo install -m 0755 kubectl /usr/local/bin/kubectl
          fi
          flux version --client
          kubectl version --client

      - name: Prepare shared switch and recovery commands
        run: |
          set -euo pipefail
          cat > gitops-live-control.sh <<'SCRIPT'
          #!/bin/sh
          set -eu
          instance=fluxinstance.fluxcd.controlplane.io/flux
          source=gitrepository.source.toolkit.fluxcd.io/flux-system
          root=kustomization.kustomize.toolkit.fluxcd.io/flux-system
          layers="infrastructure-controllers infrastructure-configs apps"
          configure_cluster() {
            # Explicit config avoids kubectl's in-cluster fallback changing when
            # flags such as --request-timeout override the default REST config.
            test -r /var/run/secrets/kubernetes.io/serviceaccount/token
            test -r /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            KUBECONFIG="$(mktemp)"
            export KUBECONFIG
            cat > "$KUBECONFIG" <<'CONFIG'
          apiVersion: v1
          kind: Config
          clusters:
            - name: homelab
              cluster:
                server: https://kubernetes.default.svc
                certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          users:
            - name: ci-deployer
              user:
                tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          contexts:
            - name: homelab
              context:
                cluster: homelab
                user: ci-deployer
                namespace: flux-system
          current-context: homelab
          CONFIG
            printf 'KUBECONFIG=%s\n' "$KUBECONFIG"
          }
          k() { kubectl --request-timeout=30s -n flux-system "$@"; }
          field() { k get "$1" -o "jsonpath=$2"; }
          ready() {
            k wait "$1" --for=condition=Ready --timeout=3m
            test "$(field "$1" '{.metadata.generation}')" = "$(field "$1" '{.status.observedGeneration}')"
            test "$(field "$1" '{.metadata.generation}')" = "$(field "$1" '{.status.conditions[?(@.type=="Ready")].observedGeneration}')"
          }
          revision_prefix() {
            if [ "$MODE" = operator ]; then
              printf 'refs/heads/%s@sha1:' "$1"
            else
              printf '%s@sha1:' "$1"
            fi
          }
          handled() {
            k wait "$1" --for="jsonpath={.status.lastHandledReconcileAt}=$2" --timeout=3m
          }
          reconcile() {
            k annotate "$1" "reconcile.fluxcd.io/requestedAt=$2" --overwrite
            handled "$1" "$2"
            ready "$1"
          }
          app_children() {
            k get kustomizations.kustomize.toolkit.fluxcd.io \
              -l 'kustomize.toolkit.fluxcd.io/name=apps,kustomize.toolkit.fluxcd.io/namespace=flux-system' -o name
          }
          reconcile_layer() {
            layer_resource="kustomization.kustomize.toolkit.fluxcd.io/$1"
            layer_token="$2"
            layer_revision="$3"
            if [ "$1" = apps ]; then
              # Request children while apps waits for their health. Waiting for apps
              # first can block the very reconciles that would make it Ready.
              k annotate "$layer_resource" "reconcile.fluxcd.io/requestedAt=$layer_token" --overwrite
              attempts=0
              while [ "$attempts" -lt 120 ]; do
                children="$(app_children)"
                for child in $children; do
                  if [ "$(field "$child" '{.spec.suspend}')" = true ]; then
                    echo "Refusing to reconcile suspended child: $child" >&2
                    return 1
                  fi
                  child_token="${layer_token}-$(field "$child" '{.metadata.generation}')"
                  if [ "$(field "$child" '{.metadata.annotations.reconcile\.fluxcd\.io/requestedAt}')" != "$child_token" ]; then
                    k annotate "$child" "reconcile.fluxcd.io/requestedAt=$child_token" --overwrite
                  fi
                done
                [ "$(field "$layer_resource" '{.status.lastHandledReconcileAt}')" = "$layer_token" ] && break
                attempts=$((attempts + 1))
                sleep 3
              done
              test "$attempts" -lt 120
              ready "$layer_resource"
              test "$(field "$layer_resource" '{.status.lastAppliedRevision}')" = "$layer_revision"
              # Discover again after apps finishes applying and pruning. Old child
              # Ready conditions must not stand in for this revision's verdict.
              children="$(app_children)"
              for child in $children; do
                test "$(field "$child" '{.spec.sourceRef.kind}')" = GitRepository
                test "$(field "$child" '{.spec.sourceRef.name}')" = flux-system
                child_source_namespace="$(field "$child" '{.spec.sourceRef.namespace}')"
                test -z "$child_source_namespace" || test "$child_source_namespace" = flux-system
                test "$(field "$child" '{.spec.suspend}')" != true
                reconcile "$child" "${layer_token}-verify"
                test "$(field "$child" '{.status.lastAppliedRevision}')" = "$layer_revision"
              done
            else
              reconcile "$layer_resource" "$layer_token"
              test "$(field "$layer_resource" '{.status.lastAppliedRevision}')" = "$layer_revision"
            fi
          }
          pause_instance() {
            if [ "$MODE" = operator ]; then
              k patch "$instance" --type=merge -p "{\"metadata\":{\"annotations\":{\"fluxcd.controlplane.io/reconcile\":\"disabled\",\"reconcile.fluxcd.io/requestedAt\":\"$1\"}}}"
              # The disabled reconciliation acknowledges this request after any
              # older reconcile finishes. Ready alone can describe an older run.
              handled "$instance" "$1"
            fi
          }
          suspend_root() {
            k patch "$root" --type=merge -p "{\"spec\":{\"suspend\":true},\"metadata\":{\"annotations\":{\"reconcile.fluxcd.io/requestedAt\":\"$1\"}}}"
            handled "$root" "$1"
          }
          set_source() {
            # Replace the whole ref. A leftover name, tag or commit takes precedence.
            if [ "$MODE" = operator ]; then
              ref="{\"name\":\"refs/heads/$1\"}"
            else
              ref="{\"branch\":\"$1\"}"
            fi
            k patch "$source" --type=json -p "[{\"op\":\"replace\",\"path\":\"/spec/ref\",\"value\":${ref}}]"
          }
          assert_ref() {
            if [ "$MODE" = operator ]; then
              test "$(field "$source" '{.spec.ref.name}')" = "refs/heads/$1"
            else
              test "$(field "$source" '{.spec.ref.branch}')" = "$1"
            fi
          }
          assert_pr() {
            ready "$source"
            test "$(field "$root" '{.spec.suspend}')" = true
            test "$(field "$source" '{.status.artifact.revision}')" = "$(revision_prefix "$HEAD_BRANCH")${HEAD_SHA}"
            assert_ref "$HEAD_BRANCH"
            if [ "$MODE" = operator ]; then
              test "$(field "$instance" '{.spec.sync.ref}')" = "refs/heads/${HEAD_BRANCH}"
              test "$(field "$instance" '{.metadata.annotations.fluxcd\.controlplane\.io/reconcile}')" = disabled
            fi
          }
          restore() {
            token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-restore-$(date +%s)"
            pause_instance "${token}-pause"
            suspend_root "${token}-root"
            if [ "$MODE" = operator ]; then
              k patch "$instance" --type=merge -p '{"spec":{"sync":{"ref":"refs/heads/main"}}}'
            fi
            set_source main
            reconcile "$source" "${token}-source"
            main_revision="$(field "$source" '{.status.artifact.revision}')"
            case "$main_revision" in "$(revision_prefix main)"*) ;; *) return 1 ;; esac
            # Never resume the root while the stored artifact still contains PR YAML.
            if [ "$MODE" = operator ]; then
              k patch "$instance" --type=merge -p "{\"metadata\":{\"annotations\":{\"fluxcd.controlplane.io/reconcile\":${ORIGINAL_RECONCILE},\"reconcile.fluxcd.io/requestedAt\":\"${token}-enable\"}}}"
              handled "$instance" "${token}-enable"
              k wait "$instance" --for=condition=Ready --timeout=3m
            fi
            k patch "$root" --type=merge -p '{"spec":{"suspend":false}}'
            reconcile "$root" "${token}-root-main"
            test "$(field "$root" '{.status.lastAppliedRevision}')" = "$main_revision"
            for layer in $layers; do
              reconcile_layer "$layer" "${token}-${layer}" "$main_revision"
            done
            assert_ref main
            test "$(field "$source" '{.status.artifact.revision}')" = "$main_revision"
            test "$(field "$root" '{.spec.suspend}')" != true
            if [ "$MODE" = operator ]; then
              test "$(field "$instance" '{.spec.sync.ref}')" = refs/heads/main
              test "$(field "$instance" '{.metadata.annotations.fluxcd\.controlplane\.io/reconcile}')" != disabled
            fi
          }
          case "$1" in
            kubeconfig) configure_cluster ;;
            switch)
              pause_instance "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pause"
              suspend_root "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-root"
              if [ "$MODE" = operator ]; then
                k patch "$instance" --type=merge -p "{\"spec\":{\"sync\":{\"ref\":\"refs/heads/${HEAD_BRANCH}\"}}}"
              fi
              set_source "$HEAD_BRANCH"
              ;;
            revision) printf '%s%s\n' "$(revision_prefix "$HEAD_BRANCH")" "$HEAD_SHA" ;;
            assert-pr) assert_pr ;;
            reconcile-layer)
              assert_pr
              reconcile_layer "$2" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pr-$2-$(date +%s)" "$(revision_prefix "$HEAD_BRANCH")${HEAD_SHA}"
              assert_pr
              ;;
            restore) restore ;;
            watchdog)
              configure_cluster >/dev/null
              k get "$source" -o name >/dev/null
              touch /tmp/gitops-watchdog-ready
              remaining=$((WATCHDOG_DEADLINE - $(date +%s)))
              if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
              # Retry transient API/controller failures independently of the runner.
              # Keep restore outside an if/until condition so set -e still works.
              set +e
              while :; do
                (set -e; restore)
                result=$?
                [ "$result" -eq 0 ] && exit 0
                echo "Recovery failed; retrying in 15 seconds"
                sleep 15
              done
              ;;
          esac
          SCRIPT
          sh gitops-live-control.sh kubeconfig >> "$GITHUB_ENV"

      - name: Require an idle cluster on main
        run: |
          set -euo pipefail
          test -z "$(kubectl -n arc-runners get jobs -l app.kubernetes.io/name=gitops-watchdog -o name)"
          kubectl -n flux-system get gitrepository flux-system -o json > live-source.json
          kubectl -n flux-system get kustomization flux-system -o json > live-root.json
          # Empty discovery means legacy. Forbidden, transport and discovery errors fail.
          resources="$(kubectl api-resources --api-group=fluxcd.controlplane.io -o name)"
          printf '{}\n' > live-instance.json
          if grep -qx 'fluxinstances.fluxcd.controlplane.io' <<< "$resources"; then
            kubectl -n flux-system get fluxinstance flux --ignore-not-found -o json > live-instance.json
            test -s live-instance.json || printf '{}\n' > live-instance.json
          fi
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = json.loads(Path('live-source.json').read_text())
          root = json.loads(Path('live-root.json').read_text())
          instance = json.loads(Path('live-instance.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['HEAD_SHA'])
          assert re.fullmatch(r'[A-Za-z0-9._/-]+', os.environ['HEAD_BRANCH'])
          assert os.environ['HEAD_BRANCH'] != 'main', 'Refusing to test main as a PR branch'
          allowed_refs = [{'branch': 'main'}]
          if instance:
              allowed_refs += [{'name': 'refs/heads/main'}, {'branch': 'main', 'name': 'refs/heads/main'}]
          assert source['spec']['ref'] in allowed_refs, 'Source must start on main without other ref selectors'
          assert not source['spec'].get('suspend', False)
          assert not root['spec'].get('suspend', False), 'Root is already suspended'
          mode, annotation = 'legacy', None
          if instance:
              mode = 'operator'
              sync = instance['spec']['sync']
              assert sync['kind'] == 'GitRepository' and sync['ref'] == 'refs/heads/main'
              assert sync.get('name', 'flux-system') == 'flux-system'
              annotation = instance['metadata'].get('annotations', {}).get('fluxcd.controlplane.io/reconcile')
              assert annotation in (None, 'enabled'), 'FluxInstance is already paused or has an unknown reconcile setting'
              assert any(c['type'] == 'Ready' and c['status'] == 'True' for c in instance['status']['conditions'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MODE={mode}\nORIGINAL_RECONCILE={json.dumps(annotation)}\n')
              env.write(f'WATCHDOG_JOB=gitops-watchdog-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          PY
          flux get kustomizations

      - name: Arm independent recovery before changing Flux
        id: watchdog
        run: |
          set -euo pipefail
          python3 - <<'PY' | kubectl create -f -
          import json, os, time
          from pathlib import Path
          env = [{'name': key, 'value': os.environ[key]} for key in
                 ('MODE', 'ORIGINAL_RECONCILE', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')]
          env.append({'name': 'WATCHDOG_DEADLINE',
                      'value': str(int(time.time()) + int(os.environ['WATCHDOG_SECONDS']))})
          job = {
              'apiVersion': 'batch/v1', 'kind': 'Job',
              'metadata': {'name': os.environ['WATCHDOG_JOB'], 'namespace': 'arc-runners',
                           'labels': {'app.kubernetes.io/name': 'gitops-watchdog'}},
              'spec': {'backoffLimit': 6, 'ttlSecondsAfterFinished': 300,
                       'activeDeadlineSeconds': int(os.environ['WATCHDOG_SECONDS']) + 7200,
                       'template': {'spec': {
                           'serviceAccountName': 'ci-deployer', 'restartPolicy': 'Never',
                           'securityContext': {'runAsNonRoot': True, 'runAsUser': 65532,
                                               'seccompProfile': {'type': 'RuntimeDefault'}},
                           'containers': [{
                               'name': 'watchdog', 'image': os.environ['WATCHDOG_IMAGE'], 'env': env,
                               'securityContext': {'allowPrivilegeEscalation': False,
                                                   'capabilities': {'drop': ['ALL']}},
                               'command': ['/bin/sh', '-c'],
                               'args': [Path('gitops-live-control.sh').read_text(), 'recovery', 'watchdog'],
                               'readinessProbe': {'exec': {'command': [
                                   '/bin/sh', '-c', 'test -f /tmp/gitops-watchdog-ready']},
                                   'periodSeconds': 2, 'timeoutSeconds': 1},
                           }],
                       }}},
          }
          print(json.dumps(job))
          PY
          # Record creation before checking readiness, so cleanup also runs if the pod fails.
          echo 'armed=true' >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            if [ "$(kubectl -n arc-runners get pods -l "job-name=${WATCHDOG_JOB}" \
              -o jsonpath='{.items[*].status.containerStatuses[0].ready}')" = true ]; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::Watchdog did not start; refusing to change Flux'
          exit 1

      - name: Pause the operator and root, then switch to the PR
        run: sh gitops-live-control.sh switch

      - name: Reconcile + health verdict
        id: verdict
        run: |
          set +e
          FAIL=0
          echo "::group::reconcile source + wait for the PR branch artifact"
          flux reconcile source git flux-system --timeout=3m || FAIL=1
          # Check the immutable PR head, not just a branch name that can move.
          SWITCHED=0
          EXPECTED_REVISION="$(sh gitops-live-control.sh revision)"
          for _ in $(seq 1 20); do
            REV="$(kubectl -n flux-system get gitrepository flux-system \
              -o jsonpath='{.status.artifact.revision}' 2>/dev/null)"
            echo "artifact revision: ${REV}"
            case "${REV}" in
              "$EXPECTED_REVISION") SWITCHED=1; break ;;
            esac
            flux reconcile source git flux-system --timeout=60s
            sleep 3
          done
          echo "::endgroup::"
          if [ "${SWITCHED}" -ne 1 ]; then
            echo "::error::Source never reached the expected PR SHA; cannot health-test"
            FAIL=1
          else
            for k in infrastructure-controllers infrastructure-configs apps; do
              sh gitops-live-control.sh assert-pr || { FAIL=1; break; }
              echo "::group::reconcile kustomization ${k}"
              sh gitops-live-control.sh reconcile-layer "$k"
              rc=$?
              echo "::endgroup::"
              [ "${rc}" -ne 0 ] && FAIL=1
              sh gitops-live-control.sh assert-pr || FAIL=1
            done
          fi
          echo "verdict_fail=${FAIL}" >> "${GITHUB_OUTPUT}"
          { echo '### Flux live health-test'; echo; \
            echo "Tested source revision: \`$(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.status.artifact.revision}')\`"; \
            echo; echo '```'; flux get kustomizations 2>&1; echo '```'; } > flux-status.md
          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Live health-test failed; see reconcile logs above"
          fi

      - name: Restore main and confirm recovery
        id: restore
        if: always() && steps.watchdog.outputs.armed == 'true'
        run: |
          set -euo pipefail
          sh gitops-live-control.sh restore
          # Leave the watchdog armed on any recovery failure.
          kubectl -n arc-runners delete job "$WATCHDOG_JOB" --ignore-not-found --wait=true
          echo 'restored=true' >> "$GITHUB_OUTPUT"

      - name: Comment verdict on PR (always)
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const fail = '${{ steps.verdict.outputs.verdict_fail }}';
            const restored = '${{ steps.restore.outputs.restored }}' === 'true';
            let body = fs.existsSync('flux-status.md')
              ? fs.readFileSync('flux-status.md', 'utf8')
              : '### Flux live health-test\n\nNo status captured. The test aborted before reconciliation.';
            const verdict = fail === '0' && restored
              ? '\n\nPASS. The child Kustomizations reached Ready at the PR head SHA. The root and FluxInstance stayed suspended during the test.'
              : '\n\nFAIL. Testing or restoration did not complete. Do not merge based on this run.';
            body += verdict + (restored
              ? '\n\nRecovery to `main` was verified.'
              : '\n\nRecovery is unconfirmed. Check the workflow and any remaining watchdog Job.');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail the job if the health-test failed
        if: always()
        run: |
          test "${{ steps.verdict.outputs.verdict_fail }}" = "0"
          test "${{ steps.restore.outputs.restored }}" = "true"
