---
- name: Validate target and wait for raw trusted root SSH without Python
  hosts: pihole
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.import_tasks: tasks/identity.yml
    - name: Wait for guest SSH socket from the controller, not a Python-less guest
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 300
      delegate_to: localhost
      check_mode: false
    - name: Wait for template SSH before Python modules
      ansible.builtin.raw: test "$(id -u)" = 0 && test -r /etc/debian_version
      register: pihole_ssh_ready
      until: pihole_ssh_ready is succeeded
      retries: 60
      delay: 5
      changed_when: false
      check_mode: false
