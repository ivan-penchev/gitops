---
- name: Require explicit single inventory host before gathering facts or remote commands
  ansible.builtin.assert:
    that:
      - pihole_target is defined
      - pihole_target is string
      - inventory_hostname == pihole_target
      - inventory_hostname in groups['pihole']
      - ansible_play_hosts_all | length == 1
    fail_msg: Use --limit ONE_ALIAS -e pihole_target=ONE_ALIAS; no fleet operations.

- name: Read minimal Debian and virtualization facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - min
      - virtualization

- name: Require a dedicated Debian VM or physical machine, not a container
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int >= 12
      - ansible_facts.virtualization_type not in ['lxc', 'docker', 'container', 'podman', 'openvz', 'systemd-nspawn']
