---
- name: Collect sanitized read-only native guest evidence even in check mode
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/probe.py') }}"
      - "{{ pihole_dns_bind }}"
      - "{{ pihole_interface }}"
      - "{{ pihole_ui_port | string }}"
  register: pihole_probe
  changed_when: false
  check_mode: false
- name: Decode sanitized evidence
  ansible.builtin.set_fact:
    pihole_snapshot: "{{ pihole_probe.stdout | from_json }}"
