apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  # node-exporter (part of kube-prometheus-stack) needs hostNetwork/hostPID/
  # hostPath/hostPort, which Talos' cluster-wide default PodSecurity "baseline"
  # rejects. Run this namespace at "privileged" so the DaemonSet can schedule.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
