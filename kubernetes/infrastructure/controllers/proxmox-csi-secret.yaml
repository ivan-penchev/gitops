---
# Cloud-config for proxmox-csi-plugin. Flux fills the token from the
# Terraform-written cluster-secrets-tf Secret and the rest from
# cluster-config-tf (terraform/cluster/proxmox-csi.tf).
apiVersion: v1
kind: Secret
metadata:
  name: proxmox-csi-plugin
  namespace: kube-system
type: Opaque
stringData:
  config.yaml: |
    clusters:
      - url: ${proxmox_csi_url}
        insecure: ${proxmox_insecure}
        token_id: ${proxmox_csi_token_id}
        token_secret: ${proxmox_csi_token_secret}
        region: ${proxmox_region}
