    token: ENC[AES256_GCM,data:KaKW9TiU+vPa7rs6jOI46Qxz7DzEn6jvgpITxtwruoZUf3E9leZuPtIetgqgnOL1XosbKHT0FHVbEPZi1GiLCDjZcZ/bso4gxTssbhiDQ9peH9ieVABtSWNmDYc03X3vppRHfaXZjdwPCzfc1l12IXWQXD3CmBezi9u/Y8L582GxZDFntOUgAawjRwGAe7a7GV14w+pp/K/DJyVKW5F86zp24IzSV45ueZuZq6y+RyqlfTt6VeFYCQ==,iv:zfohhUaTLIqthRBlce+V9E0C6/WKjvx/UVFnt5Zg2zI=,tag:va+hz8EpDWnfIoTVsi14cg==,type:str]
