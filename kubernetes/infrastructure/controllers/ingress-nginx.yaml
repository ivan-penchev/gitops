---
# ingress-nginx — the single in-cluster traffic controller. Two entry paths
# both terminate here:
#   * Public  : internet -> Cloudflare edge -> tunnel (cloudflared pod) ->
#               this controller's ClusterIP (in-cluster) -> Service.
#   * Internal: LAN client -> DNS (*.int.home.17072021.xyz -> the LB IP below)
#               -> this controller's LoadBalancer IP -> Service.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
  values:
    controller:
      replicaCount: 2
      # Make nginx the default class so Ingresses without an explicit class use it.
      ingressClassResource:
        default: true
      service:
        type: LoadBalancer
        # Pin a stable LAN IP from the Cilium LB pool (.40-.49) so the internal
        # wildcard DNS A record (*.int.home) has a fixed target.
        annotations:
          lbipam.cilium.io/ips: "192.168.68.40"
      config:
        # cloudflared/Cloudflare forwards the real client IP + proto in headers.
        use-forwarded-headers: "true"
      # Default TLS cert for internal (*.int.home) hosts; issued by cert-manager
      # in the internal-tls phase. Harmless warning until the secret exists.
      extraArgs:
        default-ssl-certificate: "ingress-nginx/int-home-tls"
      metrics:
        enabled: false
