---
# Proxmox CSI (sergelogvinov). Provisions PVs as Proxmox disks on `tank`.
# Reads its cloud-config from the `proxmox-csi-plugin` Secret in proxmox-csi-secret.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: proxmox-csi
  namespace: kube-system
spec:
  interval: 24h
  url: oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
  ref:
    tag: "0.5.12"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: proxmox-csi
    namespace: kube-system
  values:
    existingConfigSecret: proxmox-csi-plugin
    storageClass:
      - name: proxmox-tank
        storage: tank
        reclaimPolicy: Delete
        fstype: ext4
        cache: writethrough
