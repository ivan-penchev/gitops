---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.16.5" # TODO: pin to a current Cilium release
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  # Values MUST match the Talos inlineManifests bootstrap values to avoid
  # adoption drift (see plan.md). Talos-specific settings below.
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Talos control-plane VIP (cluster API endpoint).
    k8sServiceHost: "192.168.68.29"
    k8sServicePort: 6443
    # Talos mounts cgroupv2 here and forbids bpf host mount elsewhere.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # L2 announcements for LoadBalancer IPs on the flat LAN (no BGP).
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
