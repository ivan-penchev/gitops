---
# Locally-managed tunnel config. Because our Cloudflare API token lacks the
# Zero Trust "Tunnel: Edit" permission, we do NOT use the remote (dashboard)
# config. Instead cloudflared runs in credentials-file mode and reads its
# ingress rules from this ConfigMap (GitOps-managed). Any hostname CNAME'd to
# this tunnel (<app>.17072021.xyz) is forwarded to ingress-nginx in-cluster;
# ingress-nginx then routes by Host header. Only hosts explicitly pointed at
# this tunnel via DNS ever arrive here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: ${tunnel_id}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # Origin requests keep their original Host header, so ingress-nginx can
    # route by hostname. Catch-all -> ingress; ingress 404s unknown hosts.
    ingress:
      - service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
---
# Cloudflare Tunnel connector — the ONLY inbound path from the internet (no
# public IP / CGNAT). Runs in credentials-file mode using `credentials.json`
# from the SOPS-encrypted `cloudflared-token` Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-token
            items:
              - key: credentials.json
                path: credentials.json
