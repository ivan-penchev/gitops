---
# Let's Encrypt issuer using Cloudflare DNS-01 (works behind CGNAT / no ingress
# reachability needed). Requires SOPS secret `cloudflare-api-token` in
# cert-manager namespace with key `api-token`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com # TODO: set your email
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
