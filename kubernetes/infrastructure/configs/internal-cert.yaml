# Wildcard TLS for internal apps. cert-manager solves DNS-01 through the
# Cloudflare API token. Traefik's default TLSStore serves the `int-home-tls`
# Secret from its own namespace, so every *.lan_domain host gets valid HTTPS on
# the LAN without a tls block per Ingress.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: int-home-wildcard
  namespace: traefik
spec:
  secretName: int-home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.${lan_domain}"
  dnsNames:
    - "*.${lan_domain}"
