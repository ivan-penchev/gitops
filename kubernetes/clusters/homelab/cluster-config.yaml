---
# Central, NON-SECRET shared configuration for the homelab cluster.
#
# Single source of truth for the STATIC identifiers/addresses that were
# previously hardcoded across many manifests (domains, LB IPs). Every Flux
# Kustomization references this via `postBuild.substituteFrom`, so manifests use
# ${var} placeholders instead of magic strings.
#
# PER-CLUSTER / TERRAFORM-OWNED values (cf_zone_id, cf_account_id, tunnel_id,
# public_domain, lan_domain, dns_owner_id) do NOT
# live here — Terraform writes them to the `cluster-config-tf` ConfigMap
# (see terraform/cluster/flux.tf), which is listed second in every substituteFrom.
#
# SECRETS DO NOT BELONG HERE. This ConfigMap is plaintext in Git. Secrets you
# write by hand stay SOPS-encrypted and are read via secretKeyRef. Credentials
# Terraform generates, such as API tokens, go to the `cluster-secrets-tf`
# Secret instead. Only the Kustomization that needs one lists that Secret in
# substituteFrom, and substitutes it into a Secret manifest, never a ConfigMap.
#
# This is applied by the root `flux-system` Kustomization (path
# ./kubernetes/clusters/homelab) alongside the infrastructure/apps Kustomizations
# that consume it, so it exists before they reconcile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  # Traefik LoadBalancer IP, from the Cilium LB pool below. external-dns points
  # the lan_domain A records here through each Ingress status.
  traefik_lb_ip: "192.168.68.41"
  lb_pool_start: "192.168.68.40"
  lb_pool_stop: "192.168.68.49"
