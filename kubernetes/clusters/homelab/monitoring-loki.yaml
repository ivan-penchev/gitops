# Own Loki and the shared Grafana HelmRepository after the legacy owner
# releases them with pruning disabled.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-loki
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers/loki/app
  prune: true
  wait: true
