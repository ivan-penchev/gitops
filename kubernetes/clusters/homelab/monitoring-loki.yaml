# Keep suspended until monitoring-controllers has prune: false on the cluster
# and its Loki resources have been removed from the old build.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-loki
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: monitoring-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers/loki/app
  prune: true
  wait: true
