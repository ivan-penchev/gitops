# Deploy Loki after the monitoring namespace is Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-loki
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-namespace
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers/loki/app
  prune: true
  wait: true
