# The namespace owner must be Ready before deploying Prometheus and Grafana.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-prometheus
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-namespace
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers/kube-prometheus-stack/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: cluster-config-tf
