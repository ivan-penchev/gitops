---
# Monitoring lives under apps/monitor but retains its dedicated Flux owners.
# The heavy, CRD-emitting stack keeps its own timeout/retry, isolated from the
# general apps Kustomization. Retaining owner names and inventories prevents
# pruning live releases, secrets and ServiceMonitors during this path move.
#
#   monitoring-controllers : kube-prometheus-stack + Loki + Alloy (installs the
#                            Prometheus Operator CRDs). dependsOn
#                            infrastructure-configs — needs ingress-nginx, the
#                            cert-manager int-home wildcard cert and the
#                            proxmox-tank storage class first.
#   monitoring-configs     : ServiceMonitors/PodMonitors for ingress-nginx,
#                            cert-manager and Flux. dependsOn
#                            monitoring-controllers so the CRDs it references
#                            already exist (avoids a first-apply CRD deadlock).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: cluster-config-tf
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: cluster-config-tf
