# The legacy owner has pruning disabled and no longer builds Alloy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-alloy
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-loki
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/monitor/controllers/alloy/app
  prune: true
  wait: true
