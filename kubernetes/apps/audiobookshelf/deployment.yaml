---
# Audiobookshelf — official image, version-pinned to match the LXC we are
# migrating FROM (2.35.0) so the backup/restore is exactly compatible. Runs
# non-root (uid/gid 1000) and therefore listens on 13378 (a privileged <1024
# port can't be bound as non-root); the Service still fronts it on 80. Single
# replica with a Recreate strategy because all three volumes are RWO (a rolling
# update can't attach them to two pods).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        # ABS runs non-root as the image's built-in `node` user (uid/gid 1000).
        # It joins group 0 (supplementalGroups) because all three volumes are
        # group-0 owned with group-write + setgid dirs (block config/metadata and
        # the root-populated NFS media), so it can read/write every mount with no
        # data migration. NO fsGroup on purpose: it would make kubelet try to
        # recursively chown the 1 TiB NFS mount (nfs.csi fsGroupPolicy=File).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [0]
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.35.1
          ports:
            - name: http
              containerPort: 13378
          env:
            - name: PORT
              value: "13378"
            - name: CONFIG_PATH
              value: /config
            - name: METADATA_PATH
              value: /metadata
            - name: TZ
              value: Europe/Copenhagen
            # uid 1000 can't write the image's /root; point HOME at the writable
            # config PVC in case anything in ABS/node touches $HOME.
            - name: HOME
              value: /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: media
              mountPath: /mnt/audiobooks
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: media
          persistentVolumeClaim:
            claimName: audiobookshelf-media-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  selector:
    app: audiobookshelf
  ports:
    - name: http
      port: 80
      targetPort: http
