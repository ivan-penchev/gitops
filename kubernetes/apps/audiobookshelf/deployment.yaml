---
# Audiobookshelf — official image, version-pinned to match the LXC we are
# migrating FROM (2.35.0) so the backup/restore is exactly compatible. Runs
# non-root (uid/gid 1000) and therefore listens on 13378 (a privileged <1024
# port can't be bound as non-root); the Service still fronts it on 80. Single
# replica with a Recreate strategy because all three volumes are RWO (a rolling
# update can't attach them to two pods).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        # ABS runs non-root as uid/gid 100000 — the owner the fileserver assigns
        # to the media tree (the unprivileged fileserver LXC maps its root to host
        # 100000). That NFS export (sec=sys) ignores the client's supplemental
        # group list, so group-0 membership does NOT grant media write; only the
        # file owner does. Running as 100000 gives read/write on the NFS media,
        # and supplementalGroups [0] gives read/write on the group-0-owned block
        # config/metadata PVCs. New UI uploads land as 100000:0, matching the
        # existing root-populated media. NO fsGroup on purpose: it would make
        # kubelet recursively chown the 1 TiB NFS mount (nfs.csi fsGroupPolicy=File).
        runAsNonRoot: true
        runAsUser: 100000
        runAsGroup: 100000
        supplementalGroups: [0]
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.35.1
          ports:
            - name: http
              containerPort: 13378
          env:
            - name: PORT
              value: "13378"
            - name: CONFIG_PATH
              value: /config
            - name: METADATA_PATH
              value: /metadata
            - name: TZ
              value: Europe/Copenhagen
            # uid 1000 can't write the image's /root; point HOME at the writable
            # config PVC in case anything in ABS/node touches $HOME.
            - name: HOME
              value: /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: media
              mountPath: /mnt/audiobooks
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: media
          persistentVolumeClaim:
            claimName: audiobookshelf-media-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  selector:
    app: audiobookshelf
  ports:
    - name: http
      port: 80
      targetPort: http
