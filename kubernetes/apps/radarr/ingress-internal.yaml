---
# INTERNAL only: LAN client -> DNS (*.int.home -> ingress LB) -> ingress-nginx
# -> Radarr. HTTPS via the ingress-nginx default int-home wildcard cert. Radarr
# is an admin/library manager and is never exposed publicly.
#
# This stable hostname also becomes Radarr's "baseUrl" as seen by Prowlarr (the
# Radarr app connection), which is what fixes the DHCP-drift the LXC suffered.
#
# Radarr uses SignalR (websockets) for live UI updates, so raise the proxy
# timeouts; body-size 0 lets large imports/uploads through.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-internal
  namespace: radarr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: radarr.${internal_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
