---
# Radarr — LinuxServer image, version-pinned. We migrate FROM an LXC (104); this
# image (6.x) is at least as new, so the copied radarr.db is migrated FORWARD
# automatically on first start (Radarr never migrates down — the old LXC DB stays
# as our rollback).
#
# Runs FULLY NON-ROOT as uid/gid 100000 — the owner the fileserver assigns to the
# media tree (the unprivileged fileserver LXC 110 maps its root to host 100000).
# The NFS export is sec=sys and ignores the client's supplemental group list, so
# group membership grants NO media write; only the file OWNER does. Radarr
# atomically moves imports into /media/movies, so it MUST run as 100000.
#
# Block config PVC ownership without fsGroup: a root initContainer chowns ONLY the
# small block config volume to 100000:100000. We deliberately avoid pod-wide
# fsGroup because nfs.csi fsGroupPolicy=File would make kubelet recursively chown
# the whole 1 TiB NFS media mount. PUID/PGID match runAsUser so the s6 init finds
# /config already owned correctly and skips its own chown. s6-overlay needs a
# writable /run and Radarr writes scratch to /tmp, so both are emptyDir.
#
# Single replica, Recreate strategy: the config PVC is RWO so a rolling update
# can't attach it to two pods at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100000
        runAsGroup: 100000
      initContainers:
        # Fast, block-only chown of the fresh config PVC so the non-root main
        # container can write /config. Runs as root and is the ONE place root is
        # used; it never touches the NFS media mount.
        - name: init-chown-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - chown 100000:100000 /config
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
          ports:
            - name: http
              containerPort: 7878
          env:
            - name: PUID
              value: "100000"
            - name: PGID
              value: "100000"
            - name: TZ
              value: Europe/Copenhagen
            - name: UMASK
              value: "022"
          volumeMounts:
            - name: config
              mountPath: /config
            # subPaths of the ONE media PVC -> same NFS mount / st_dev, so
            # /downloads -> /media/movies imports stay atomic-move + hardlink.
            - name: media
              mountPath: /downloads
              subPath: torrent-download
            - name: media
              mountPath: /media/movies
              subPath: movies
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: radarr-media-nfs
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: radarr
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
