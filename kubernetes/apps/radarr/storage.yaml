---
# Radarr config volume on the existing proxmox-csi `proxmox-tank` StorageClass
# (RWO block volume / ZFS zvol on the `tank` pool). volumeBindingMode is
# WaitForFirstConsumer, so the zvol is created and attached to whichever worker
# first schedules the Radarr pod.
#
#   config -> /config : the SQLite database (radarr.db — movies, quality
#                       profiles, root folders, download-client + indexer proxy
#                       links, custom formats) plus config.xml (holds the
#                       ApiKey). This is ALL of Radarr's state and is what we
#                       cold-copy from the LXC we migrate from. SMALL but
#                       critical. proxmox-tank (RWO).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-tank
  resources:
    requests:
      storage: 2Gi
---
# Static PV bound straight to the PARENT /srv/media folder on the NFS fileserver
# (fileserver LXC 110, = host /tank/media). We mount the whole tree ONCE at
# /media (no subPath) and Radarr uses /media/movies + /media/torrent-download.
# Mounting the parent once (rather than per-subdir PVs or k8s subPaths) keeps
# both under ONE NFS mount / st_dev, so Radarr's atomic-move + hardlink import
# from downloads into the movie library works. nfs.csi implements subPath as
# SEPARATE server mounts, and NFS rejects cross-mount hardlinks with EXDEV even
# on the same dataset — so a single parent mount is the only layout that keeps
# hardlinks.
#
# The old LXC also bind-mounted /media/tv, but that was a verified-unused leftover
# (Radarr manages movies only; tv is Sonarr's library and the dir is empty on
# disk), so it is intentionally dropped here.
#
# RWX + Retain: deleting this claim never touches the real library.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-media-nfs
spec:
  capacity:
    storage: 1Ti          # nominal; NFS ignores the quota
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  claimRef:
    namespace: radarr
    name: radarr-media-nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: fileserver.int.home.17072021.xyz#srv/media#radarr
    volumeAttributes:
      server: "fileserver.int.home.17072021.xyz"
      share: /srv/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-media-nfs
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  resources:
    requests:
      storage: 1Ti
  volumeName: radarr-media-nfs
