---
# Radarr config volume on the existing proxmox-csi `proxmox-tank` StorageClass
# (RWO block volume / ZFS zvol on the `tank` pool). volumeBindingMode is
# WaitForFirstConsumer, so the zvol is created and attached to whichever worker
# first schedules the Radarr pod.
#
#   config -> /config : the SQLite database (radarr.db — movies, quality
#                       profiles, root folders, download-client + indexer proxy
#                       links, custom formats) plus config.xml (holds the
#                       ApiKey). This is ALL of Radarr's state and is what we
#                       cold-copy from the LXC we migrate from. SMALL but
#                       critical. proxmox-tank (RWO).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-tank
  resources:
    requests:
      storage: 2Gi
---
# Two static NFS PVs, one per underlying ZFS child dataset on the fileserver
# (fileserver LXC 110). /tank/media/{movies,torrent-download} are SEPARATE ZFS
# datasets (not folders in tank/media), each bind-mounted into the fileserver and
# exported on its own. Because they are distinct filesystems, Radarr's import
# from /downloads into /media/movies was NEVER a hardlink — cross-dataset moves
# are always copy+delete — so there is no benefit to forcing them under one mount
# (and nfs.csi can't hardlink across separate mounts anyway). Mapping each dataset
# to its own PV keeps the exact LXC paths (/media/movies + /downloads), so the
# migrated radarr.db — root folder /media/movies, remote path mapping
# /downloads -> /downloads — needs ZERO edits.
#
# The old LXC also bind-mounted /media/tv, but that was a verified-unused leftover
# (Radarr manages movies only; tv is Sonarr's library), so it is dropped here.
#
# RWX + Retain: deleting a claim never touches the real library.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-movies-nfs
spec:
  capacity:
    storage: 1Ti          # nominal; NFS ignores the quota
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  claimRef:
    namespace: radarr
    name: radarr-movies-nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: fileserver.int.home.17072021.xyz#srv/media/movies#radarr
    volumeAttributes:
      server: "fileserver.int.home.17072021.xyz"
      share: /srv/media/movies
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-movies-nfs
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  resources:
    requests:
      storage: 1Ti
  volumeName: radarr-movies-nfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-downloads-nfs
spec:
  capacity:
    storage: 1Ti          # nominal; NFS ignores the quota
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  claimRef:
    namespace: radarr
    name: radarr-downloads-nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: fileserver.int.home.17072021.xyz#srv/media/torrent-download#radarr
    volumeAttributes:
      server: "fileserver.int.home.17072021.xyz"
      share: /srv/media/torrent-download
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-downloads-nfs
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  resources:
    requests:
      storage: 1Ti
  volumeName: radarr-downloads-nfs
