---
# INTERNAL: LAN client -> DNS (*.int.home -> ingress LB) -> Traefik -> ABS.
# HTTPS via Traefik's default int-home wildcard cert.
# During namespace migration, verify the app privately before resuming its
# Flux Kustomization. Both ingress files are included in the app recipe.
#
# ABS uses websockets and large uploads. Traefik has no body size limit, and its
# entrypoints set no read timeout, so this needs no annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf-internal
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Audiobookshelf
    gethomepage.dev/pod-selector: app=audiobookshelf
    gethomepage.dev/group: Media
    gethomepage.dev/icon: audiobookshelf.png
    gethomepage.dev/description: Audiobooks and podcasts
    gethomepage.dev/href: https://audiobookshelf.${lan_domain}
spec:
  ingressClassName: traefik
  rules:
    - host: audiobookshelf.${lan_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 80
