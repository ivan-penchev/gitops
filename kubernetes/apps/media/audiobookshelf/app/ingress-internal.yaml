---
# INTERNAL: LAN client -> DNS (*.int.home -> ingress LB) -> ingress-nginx -> ABS.
# HTTPS via the ingress-nginx default int-home wildcard cert.
# During namespace migration, verify the app privately before resuming its
# Flux Kustomization. Both ingress files are included in the app recipe.
#
# ABS uses websockets (socket.io) for live progress/UI and allows cover/book
# uploads, so raise the proxy timeouts and body size.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf-internal
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: audiobookshelf.${internal_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 80
