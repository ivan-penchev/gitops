---
# PUBLIC: internet -> Cloudflare edge (TLS) -> tunnel -> Traefik -> ABS.
# The host audiobookshelf.${public_domain} is auto-registered by external-dns as a
# proxied CNAME to the cluster tunnel (same pattern as whoami). No tls block:
# TLS terminates at the Cloudflare edge; tunnel -> origin is plain HTTP.
#
# Check the app's authentication before adding a public Ingress like this one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf-public
  namespace: media
  annotations:
spec:
  ingressClassName: traefik
  rules:
    - host: audiobookshelf.${public_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 80
