---
# PUBLIC: internet -> Cloudflare edge (TLS) -> tunnel -> ingress-nginx -> ABS.
# The host audiobookshelf.${domain} is auto-registered by external-dns as a
# proxied CNAME to the cluster tunnel (same pattern as whoami). No tls block:
# TLS terminates at the Cloudflare edge; tunnel -> origin is plain HTTP.
#
# This file is included in kustomization.yaml. Keep the app's Flux Kustomization
# suspended until existing data and authentication have been verified privately.
# See docs/app-namespace-migration.md before resuming it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf-public
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: audiobookshelf.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 80
