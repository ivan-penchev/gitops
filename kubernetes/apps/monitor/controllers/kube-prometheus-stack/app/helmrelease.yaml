---
# kube-prometheus-stack — Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics, plus the Prometheus Operator (ServiceMonitor/PodMonitor
# CRDs). This is the metrics half of the observability stack.
#
#   * Nodes    : node-exporter DaemonSet on all 3 nodes (tolerates the CP taint).
#   * Workloads: kubelet/cAdvisor + kube-state-metrics.
#   * Control-plane components (scheduler/controller-manager/etcd/kube-proxy) are
#     DISABLED on purpose — Talos doesn't expose them without machineconfig
#     patches and we run Cilium's kube-proxy replacement, so scraping them just
#     produces permanent "down" targets. See plan.md / the observability grill.
#   * Grafana is anonymous-Admin on the LAN (login form off) with a SOPS
#     break-glass admin password (grafana-admin secret). Grafana, Prometheus and
#     Alertmanager are each served on *.int.home over Traefik's default
#     wildcard cert (no per-Ingress tls block needed).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # ---- Control-plane component scrape jobs: OFF (Talos, see header) ----
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # ---- Alerting: default rules evaluate, but no external receiver yet ----
    defaultRules:
      create: true

    alertmanager:
      alertmanagerSpec:
        retention: 120h
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-tank
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Alertmanager
          gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: alertmanager.png
          gethomepage.dev/description: Alerts
          gethomepage.dev/href: https://alertmanager.${lan_domain}
        hosts:
          - alertmanager.${lan_domain}
        paths:
          - /

    # ---- node-exporter: run on every node incl. the tainted control-plane ----
    prometheus-node-exporter:
      tolerations:
        - operator: Exists

    # ---- Prometheus: 30d / 40Gi on proxmox-tank, size-capped ----
    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: "36GiB"
        # Discover ServiceMonitors/PodMonitors/Rules in ALL namespaces without
        # requiring the Helm release label (needed for our Traefik,
        # cert-manager and Flux monitors that live outside this release).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-tank
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 40Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Prometheus
          gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: prometheus.png
          gethomepage.dev/description: Metrics and queries
          gethomepage.dev/href: https://prometheus.${lan_domain}
        hosts:
          - prometheus.${lan_domain}
        paths:
          - /

    # ---- Grafana: anonymous admin on LAN + SOPS break-glass login ----
    grafana:
      # RWO PVC: a rolling update starts the new pod before the old one lets go
      # of the volume, and on another node it never mounts. Stop first.
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: proxmox-tank
        size: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
      grafana.ini:
        server:
          root_url: https://grafana.${lan_domain}
        dashboards:
          min_refresh_interval: 1m
        auth:
          disable_login_form: true
        "auth.anonymous":
          enabled: true
          org_role: Admin
      # Dashboards from grafana.com, fetched by an init container at pod start.
      # Pin the revision so an upstream edit can't change the dashboard silently.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              folder: Ingress
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      dashboards:
        grafana-com:
          traefik:
            # Traefik Official Kubernetes Dashboard, by Traefik Labs.
            gnetId: 17347
            revision: 9
            datasource:
              - name: DS_PROMETHEUS
                # The datasource uid, since panels reference it by uid.
                value: prometheus
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Grafana
          gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
          gethomepage.dev/group: Monitoring
          gethomepage.dev/icon: grafana.png
          gethomepage.dev/description: Dashboards
          gethomepage.dev/href: https://grafana.${lan_domain}
        hosts:
          - grafana.${lan_domain}
        path: /
      # Loki wired as a second datasource so logs are explorable from Grafana.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100

    # ---- kube-state-metrics: modest footprint ----
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
