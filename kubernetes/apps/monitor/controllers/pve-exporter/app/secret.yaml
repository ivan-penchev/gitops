---
# Flux fills ${pve_exporter_token} from the Terraform-written cluster-secrets-tf
# Secret. Only the monitoring-pve-exporter Kustomization reads that Secret.
apiVersion: v1
kind: Secret
metadata:
  name: pve-exporter
  namespace: monitoring
type: Opaque
stringData:
  PVE_TOKEN_VALUE: "${pve_exporter_token}"
