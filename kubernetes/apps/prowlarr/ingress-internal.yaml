---
# INTERNAL only: LAN client -> DNS (*.int.home -> ingress LB) -> ingress-nginx
# -> Prowlarr. HTTPS via the ingress-nginx default int-home wildcard cert.
# Prowlarr is an admin/indexer manager and is never exposed publicly.
#
# The *arr apps (Radarr .53, Sonarr .10) also call back to Prowlarr through this
# hostname, so it doubles as Prowlarr's stable "Prowlarr Server" URL — which is
# why moving off the DHCP LXC fixes the stale-IP drift.
#
# Prowlarr uses SignalR (websockets) for live UI updates, so raise the proxy
# timeouts; body-size 0 lets indexer definition uploads through.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-internal
  namespace: prowlarr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: prowlarr.${internal_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
