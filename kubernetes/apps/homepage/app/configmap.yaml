apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home
    theme: dark
    color: slate
    headerStyle: boxed
    layout:
      Media:
        style: row
        columns: 3
      Downloads:
        style: row
        columns: 3
      Utilities:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    traefik: false
    gateway: false
  widgets.yaml: |
    - resources:
        label: Homepage
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Cluster
        nodes:
          show: false
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  services.yaml: |
    - Media:
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://audiobookshelf.${internal_domain}
            description: Audiobooks and podcasts
    - Downloads:
        - Radarr:
            icon: radarr.png
            href: https://radarr.${internal_domain}
            description: Movie library
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.${internal_domain}
            description: Indexer management
    - Utilities:
        - Wattbill:
            icon: mdi-lightning-bolt
            href: https://wattbill.${internal_domain}
            description: Electricity usage
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://grafana.${internal_domain}
            description: Dashboards
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.${internal_domain}
            description: Metrics and queries
        - Alertmanager:
            icon: alertmanager.png
            href: https://alertmanager.${internal_domain}
            description: Alerts
  bookmarks.yaml: |
    []
