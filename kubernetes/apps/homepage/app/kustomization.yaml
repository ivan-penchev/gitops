apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files:
      - config/settings.yaml
      - config/kubernetes.yaml
      - config/widgets.yaml
      - config/services.yaml
      - config/bookmarks.yaml
configurations:
  - name-reference.yaml
resources:
  - rbac.yaml
  - ocirepository.yaml
  - helmrelease.yaml
  - ingress-internal.yaml
