# Pull secret for the private ghcr.io/ivan-penchev/wattbill image. Without
# this the kubelet gets a 401/403 from GHCR and the pod sits in
# ImagePullBackOff forever, because the wattbill package is private.
#
# Built from a GHCR read-only PAT (scope: read:packages) stored outside this
# repo at ~/.config/wattbill/ghcr-read-token on the machine that authored this
# file, and never committed in the clear: this whole document is encrypted
# with SOPS/age, and Flux decrypts it in-cluster with the age key seeded at
# bootstrap (see kubernetes/clusters/homelab/apps.yaml `decryption:` and
# .sops.yaml). Renovate does not touch this file; it is excluded in
# renovate.json.
