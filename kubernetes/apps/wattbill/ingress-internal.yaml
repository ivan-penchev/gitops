---
# LAN route: client -> DNS (*.int.home -> ingress LB) -> ingress-nginx -> Wattbill.
# HTTPS uses ingress-nginx's default int-home wildcard cert. This hostname is
# internal; ingress-public.yaml separately exposes the app without a login gate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wattbill-internal
  namespace: wattbill
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Wattbill
    gethomepage.dev/pod-selector: app.kubernetes.io/name=wattbill
    gethomepage.dev/group: Utilities
    gethomepage.dev/icon: mdi-lightning-bolt
    gethomepage.dev/description: Electricity usage
    gethomepage.dev/href: https://wattbill.${internal_domain}
spec:
  ingressClassName: nginx
  rules:
    - host: wattbill.${internal_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wattbill
                port:
                  number: 8080
