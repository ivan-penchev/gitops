# Bazarr config volume: its database and config.yaml with the API key,
# languages, providers and the Radarr and Sonarr connections.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-tank
  resources:
    requests:
      storage: 1Gi
---
# Static NFS PVs for the two libraries Bazarr writes subtitles into. Retain
# means deleting a claim never touches the library.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-movies-nfs
spec:
  capacity:
    storage: 1Ti # nominal, NFS ignores it
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  claimRef:
    namespace: downloads
    name: bazarr-movies-nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: fileserver.int.home.17072021.xyz#srv/media/movies#bazarr
    volumeAttributes:
      server: "fileserver.int.home.17072021.xyz"
      share: /srv/media/movies
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-movies-nfs
  namespace: downloads
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  resources:
    requests:
      storage: 1Ti
  volumeName: bazarr-movies-nfs
---
