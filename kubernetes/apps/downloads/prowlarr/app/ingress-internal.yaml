---
# INTERNAL only: LAN client -> DNS (*.int.home -> ingress LB) -> Traefik
# -> Prowlarr. HTTPS via Traefik's default int-home wildcard cert.
# Prowlarr is an admin/indexer manager and is never exposed publicly.
#
# The *arr apps (Radarr .53, Sonarr .10) also call back to Prowlarr through this
# hostname, so it doubles as Prowlarr's stable "Prowlarr Server" URL — which is
# why moving off the DHCP LXC fixes the stale-IP drift.
#
# Traefik needs no annotations for SignalR websockets or uploads. It has no body
# size limit, and its entrypoints set no read timeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-internal
  namespace: downloads
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/pod-selector: app=prowlarr
    gethomepage.dev/group: Downloads
    gethomepage.dev/icon: prowlarr.png
    gethomepage.dev/description: Indexer management
    gethomepage.dev/href: https://prowlarr.${lan_domain}
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.${lan_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
