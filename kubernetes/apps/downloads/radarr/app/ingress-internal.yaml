---
# INTERNAL only: LAN client -> DNS (*.int.home -> ingress LB) -> Traefik
# -> Radarr. HTTPS via Traefik's default int-home wildcard cert. Radarr
# is an admin/library manager and is never exposed publicly.
#
# This stable hostname also becomes Radarr's "baseUrl" as seen by Prowlarr (the
# Radarr app connection), which is what fixes the DHCP-drift the LXC suffered.
#
# Traefik needs no annotations for SignalR websockets or uploads. It has no body
# size limit, and its entrypoints set no read timeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-internal
  namespace: downloads
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Radarr
    gethomepage.dev/pod-selector: app=radarr
    gethomepage.dev/group: Downloads
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/description: Movie library
    gethomepage.dev/href: https://radarr.${lan_domain}
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.${lan_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
