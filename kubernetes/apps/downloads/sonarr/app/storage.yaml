    - noatime
  claimRef:
    namespace: downloads
    name: sonarr-downloads-nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: fileserver.int.home.17072021.xyz#srv/media/torrent-download#sonarr
    volumeAttributes:
